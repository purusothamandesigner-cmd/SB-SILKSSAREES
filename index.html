<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SB Silks & Sarees</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#061c12;color:#f4f3df;min-height:100vh;padding:30px 15px}
.card{max-width:760px;margin:auto;padding:34px 28px 30px;background:linear-gradient(145deg,#123c27,#082719);border:2px solid #c9a84c;border-radius:32px;box-shadow:0 20px 60px rgba(0,0,0,.45);text-align:center}
.logo{width:190px;height:190px;object-fit:contain;border-radius:50%;background:#edf5b9;border:4px solid #d7b65b;margin:0 auto 18px;display:block}
h1{font-family:Georgia,serif;font-size:clamp(36px,7vw,62px);letter-spacing:2px;color:#e5c36c;margin:5px 0 12px}
.tag{font-family:Georgia,serif;font-size:clamp(25px,4vw,40px);font-style:italic;color:#d8dfc4;margin:0 0 16px}
.sub{font-size:18px;color:#d5ddcf;margin-bottom:28px}
.line{height:1px;background:linear-gradient(90deg,transparent,#c9a84c,transparent);margin:20px 0}
.address{font-size:20px;line-height:1.55;color:#e1e5d9;max-width:620px;margin:22px auto}
.phone-row{display:flex;gap:10px;margin:25px 0}
.phone{flex:1;background:linear-gradient(90deg,#dcebbf,#c7e3b6);color:#183221;border-radius:16px;padding:20px;font-size:25px;font-weight:700;text-decoration:none}
.whatsapp{width:90px;background:#22b96b;color:white;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:34px;text-decoration:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:86px;border-radius:18px;text-decoration:none;color:white;font-size:24px;font-weight:700;background:linear-gradient(145deg,#174a2f,#0c2d1d);border:1px solid #71945e}
.full{grid-column:1/-1;background:linear-gradient(90deg,#dcebbf,#c7e3b6);color:#183221}
.icon{font-size:34px}
footer{margin-top:28px;padding-top:20px;border-top:1px solid #846d32;color:#e5c36c;font-family:Georgia,serif;font-size:22px;font-style:italic}
@media(max-width:600px){body{padding:12px 8px}.card{padding:24px 15px;border-radius:24px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.phone-row{flex-direction:column}.whatsapp{width:100%;height:70px}.btn{font-size:21px;min-height:72px}.address{font-size:17px}}
</style>
</head>
